services:
  sub2api:
    image: ghcr.io/66-dashun/sub2api:${SUB2API_VERSION:-0.1.171}
    volumes:
      - type: bind
        source: ${IMAGE_UPDATER_SOCKET_DIR:-/run/sub2api-image-updater}
        target: /run/sub2api-image-updater
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${IMAGE_UPDATER_CLIENT_TOKEN_FILE:-/etc/sub2api-image-updater/client-token}
        target: /run/sub2api-image-updater/client-token
        read_only: true
        bind:
          create_host_path: false
    environment:
      UPDATE_MODE: container
      UPDATE_RELEASE_REPO: 66-DASHUN/sub2api-qa
      UPDATE_RELEASE_TAG_PREFIX: qa-v
      UPDATE_HELPER_SOCKET: /run/sub2api-image-updater/updater.sock
      UPDATE_HELPER_TOKEN_FILE: /run/sub2api-image-updater/client-token
      UPDATE_GITHUB_TOKEN_FILE: ${UPDATE_GITHUB_TOKEN_FILE:-}
